<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | CMS</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../Admin/AdminTheme.css">
    <style>
        .admin-main .content-card.notifications-panel {
            background: #ffffff !important;
            border: 1px solid #ede9fe !important;
            border-radius: 22px !important;
            box-shadow: 0 10px 30px rgba(46, 16, 101, 0.05) !important;
            padding: 20px !important;
        }
        .filter-card {
            background: #ffffff;
            border: 1px solid #ede9fe;
            border-radius: 18px;
            padding: 12px 16px;
            box-shadow: 0 8px 24px rgba(46, 16, 101, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .search-box {
            flex: 1;
            height: 42px;
            background: #f8f5ff;
            border: 1.5px solid #e2d9f3;
            padding: 0 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .search-box:focus-within {
            background: #ffffff;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }
        .search-box i {
            color: #7c3aed;
            font-size: 14px;
        }
        .search-box input#searchNotif {
            border: none !important;
            outline: none !important;
            background: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            height: 100%;
            width: 100%;
            font-size: 13.5px;
            color: #2e1065;
        }
        #typeFilter {
            height: 42px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1.5px solid #e2d9f3;
            background: #f8f5ff;
            color: #2e1065;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            min-width: 185px;
            outline: none;
            box-shadow: none;
        }
        #typeFilter:focus {
            background: #ffffff;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }
        .portal-notif-page-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .portal-notif-page-item {
            background: #faf8ff;
            border: 1px solid #ece3ff;
            border-radius: 16px;
            padding: 12px 15px;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .portal-notif-page-item:hover {
            border-color: #c4b5fd;
            transform: translateY(-1px);
        }
        .portal-notif-page-item.unread,
        .portal-notif-page-item.is-recent {
            background: linear-gradient(135deg, #faf5ff 0%, #f5f3ff 100%);
            border-color: #c4b5fd;
            border-left: 4px solid #7c3aed;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.08);
        }
        .recent-new-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            background: #7c3aed;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            vertical-align: middle;
            margin-left: 8px;
        }
        .portal-notif-page-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .portal-notif-page-head h3 {
            margin: 0;
            font-size: 14.5px;
            color: #2e1065;
        }
        .portal-notif-page-meta {
            font-size: 11.5px;
            color: #7b6f96;
            white-space: nowrap;
        }
        .portal-notif-item-type {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: #6d28d9;
            background: #ede9fe;
            padding: 3px 9px;
            border-radius: 10px;
            margin-bottom: 5px;
        }
        .portal-notif-page-body {
            margin: 0;
            font-size: 13px;
            line-height: 1.45;
            color: #4b5563;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #f1ebff;
        }
        .pagination-info {
            font-size: 12.5px;
            color: #6d5f85;
            font-weight: 500;
        }
        .pagination-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .pagination-btn {
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid #e2d9f3;
            background: #ffffff;
            color: #4c1d95;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .pagination-btn:hover:not(:disabled) {
            background: #f3e8ff;
            border-color: #c4b5fd;
        }
        .pagination-btn.active {
            background: #7c3aed;
            border-color: #7c3aed;
            color: #ffffff;
        }
        .pagination-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
    </style>

    <link rel="stylesheet" href="../shared/custom-alerts.css">
    <script src="../shared/custom-alerts.js"></script>
</head>

<body class="admin-portal notifications-full-page">

    <script>
        const userRole = localStorage.getItem("role");

        if (userRole !== "faculty" && userRole !== "admin") {
            document.documentElement.classList.add("capx-auth-blocked");
            alert("You do not have permission to access the Faculty Portal.").then(() => {
                window.location.href = "../Log-in.html";
            });
        }
    </script>

    <div class="bg1"></div>
    <div class="bg2"></div>

    <aside class="sidebar admin-sidebar">

        <div>

            <div class="logo">
                <div class="logo-mark">
                    <img src="../Images/CapstoneXicon.png" alt="CMS">
                </div>
                <div>
                    <h1>CMS</h1>
                    <p>Faculty Portal</p>
                </div>
            </div>

            <div class="menu">

                <div class="menu-title">Main</div>
                <div class="menu-item" onclick="goFacultyHome()">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </div>

                <div class="menu-title">Academic</div>
                <div class="menu-item" onclick="window.location.href='Repository.html'">
                    <i class="fa-solid fa-book-open"></i>
                    <span>Capstone Titles</span>
                </div>

                <div class="menu-title">Communication</div>
                <div class="menu-item" onclick="window.location.href='Announcements.html'">
                    <i class="fa-solid fa-bullhorn"></i>
                    <span>Announcements</span>
                </div>

                <div class="menu-item" onclick="window.location.href='Messages.html'">
                    <i class="fa-solid fa-message"></i>
                    <span>Messages</span>
                </div>

                <div class="menu-title">System</div>
                <div class="menu-item active" id="nav-notifications" onclick="window.location.href='Notifications.html'">
                    <i class="fa-solid fa-bell"></i>
                    <span>Notifications</span>
                </div>

                <div class="menu-item" onclick="window.location.href='Settings.html'">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </div>

            </div>

        </div>

        <div class="sidebar-footer">
            <div class="menu-item logout-btn" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </div>
        </div>

    </aside>

    <main class="main admin-main">

        <div class="topbar">

            <div class="welcome">
                <h1>Notifications</h1>
                <p>System updates, announcements, and account activity.</p>
            </div>

            <div class="top-actions">
                <button type="button" class="primary-btn" onclick="markAllPortalNotificationsRead()" style="border:none;background:linear-gradient(135deg,#7c3aed,#9333ea);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(124,58,237,0.22);">
                    <i class="fa-solid fa-check-double"></i>
                    <span>Mark All as Read</span>
                </button>
            </div>

        </div>

        <section class="filter-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchNotif" placeholder="Search notifications or announcements..." onkeyup="handleNotifFilter()">
            </div>
            <div>
                <select id="typeFilter" onchange="handleNotifFilter()">
                    <option value="all">All Updates</option>
                    <option value="announcement">Announcements</option>
                    <option value="document">Documents</option>
                    <option value="adviser">Adviser</option>
                    <option value="consultation">Consultation</option>
                    <option value="defense">Defense</option>
                    <option value="system">System</option>
                </select>
            </div>
        </section>

        <section class="content-card notifications-panel">
            <div class="portal-notif-page-list" id="portalNotificationsPageList">
                <div class="portal-notif-empty">Loading notifications...</div>
            </div>
            <div class="pagination-bar" id="paginationControls" style="display:none;"></div>
        </section>

    </main>

    <script>
        const loggedInUserId = localStorage.getItem("userId");
        const facultyRole = localStorage.getItem("facultyRole");
        const API_BASE = "";

        function goFacultyHome() {
            const activeSub = String(sessionStorage.getItem("active_faculty_role") || facultyRole || "").toLowerCase().trim();
            if (activeSub === "instructor") {
                window.location.href = "Instructor/InstructorDash.html";
                return;
            }

            if (activeSub === "adviser") {
                window.location.href = "Adviser/AdviserDash.html";
                return;
            }

            if (activeSub === "panelist") {
                window.location.href = "Panelist/PanelistDash.html";
                return;
            }

            window.location.href = "FacultyDash.html";
        }

        function logout() {
            localStorage.clear();
            window.location.href = "../Log-in.html";
        }

        function formatPageTime(value) {
            if (!value) {
                return "";
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return "";
            }

            return date.toLocaleString();
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        let allNotifItems = [];
        let currentPage = 1;
        const itemsPerPage = 6;

        function handleNotifFilter() {
            currentPage = 1;
            renderNotificationsPage();
        }

        function goToPage(page) {
            currentPage = page;
            renderNotificationsPage();
        }

        function renderPagination(totalItems, totalPages) {
            const paginationEl = document.getElementById("paginationControls");
            if (!paginationEl) return;
            if (totalItems === 0 || totalPages <= 1) {
                paginationEl.style.display = "none";
                paginationEl.innerHTML = "";
                return;
            }
            const startIdx = (currentPage - 1) * itemsPerPage + 1;
            const endIdx = Math.min(totalItems, currentPage * itemsPerPage);
            let buttonsHtml = `<button type="button" class="pagination-btn" onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>Prev</button>`;
            for (let p = 1; p <= totalPages; p++) {
                buttonsHtml += `<button type="button" class="pagination-btn ${p === currentPage ? "active" : ""}" onclick="goToPage(${p})">${p}</button>`;
            }
            buttonsHtml += `<button type="button" class="pagination-btn" onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>Next</button>`;
            paginationEl.style.display = "flex";
            paginationEl.innerHTML = `<span class="pagination-info">Showing ${startIdx}–${endIdx} of ${totalItems}</span><div class="pagination-buttons">${buttonsHtml}</div>`;
        }

        function renderNotificationsPage() {
            const list = document.getElementById("portalNotificationsPageList");
            const keyword = String(document.getElementById("searchNotif")?.value || "").toLowerCase().trim();
            const typeVal = String(document.getElementById("typeFilter")?.value || "all").toLowerCase();

            const filtered = allNotifItems.filter(item => {
                const title = String(item.notification_title || "").toLowerCase();
                const msg = String(item.notification_message || "").toLowerCase();
                const type = String(item.notification_type || "System").toLowerCase();
                const combined = `${title} ${msg} ${type}`;
                const matchesSearch = !keyword || combined.includes(keyword);
                const matchesType = typeVal === "all" || combined.includes(typeVal);
                return matchesSearch && matchesType;
            });

            if (!filtered.length) {
                renderPagination(0, 0);
                list.innerHTML = `<div class="portal-notif-empty">No notifications found.</div>`;
                return;
            }

            const totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filtered.slice(start, start + itemsPerPage);
            renderPagination(filtered.length, totalPages);

            list.innerHTML = pageItems.map((item, index) => {
                const unread = Number(item.is_read) === 0;
                const badgeHtml = unread ? `<span class="recent-new-badge">New</span>` : "";
                return `
                    <article class="portal-notif-page-item${unread ? " unread is-recent" : ""}" data-index="${start + index}" style="cursor:pointer;">
                        <div class="portal-notif-page-head">
                            <h3>${escapeHtml(item.notification_title)}${badgeHtml}</h3>
                            <span class="portal-notif-page-meta">${formatPageTime(item.created_at)}</span>
                        </div>
                        <span class="portal-notif-item-type">${escapeHtml(item.notification_type || "System")}</span>
                        <p class="portal-notif-page-body">${escapeHtml(item.notification_message)}</p>
                    </article>
                `;
            }).join("");

            list.querySelectorAll(".portal-notif-page-item").forEach((node) => {
                node.addEventListener("click", async () => {
                    const idx = Number(node.getAttribute("data-index"));
                    const item = filtered[idx];
                    if (item && window.PortalNotifications) {
                        await window.PortalNotifications.markRead(item.id);
                        item.is_read = 1;
                        const targetUrl = window.PortalNotifications.getNotificationTargetUrl(item);
                        if (targetUrl) {
                            const resolved = new URL(targetUrl, window.location.href).pathname.toLowerCase();
                            if (resolved === window.location.pathname.toLowerCase()) {
                                renderNotificationsPage();
                                window.PortalNotifications.refresh(false);
                            } else {
                                window.location.href = targetUrl;
                            }
                        }
                    }
                });
            });
        }

        let handledInitialNotifId = false;

        async function loadPortalNotificationsPage(isSilent = false) {
            const list = document.getElementById("portalNotificationsPageList");
            if (!isSilent) {
                list.innerHTML = `<div class="portal-notif-empty">Loading notifications...</div>`;
            }

            try {
                const response = await fetch(
                    `${API_BASE}/api/portal-notifications/summary/${encodeURIComponent(loggedInUserId)}?limit=100`,
                    { cache: "no-store" }
                );

                const data = await response.json();

                if (!data.success) {
                    list.innerHTML = `<div class="portal-notif-empty">${escapeHtml(data.message || "Failed to load notifications.")}</div>`;
                    return;
                }

                allNotifItems = data.notifications || [];

                if (!handledInitialNotifId) {
                    handledInitialNotifId = true;
                    const notifIdParam = new URLSearchParams(window.location.search).get("notifId");
                    if (notifIdParam) {
                        const matchIdx = allNotifItems.findIndex((n) => String(n.id) === String(notifIdParam));
                        if (matchIdx !== -1) {
                            currentPage = Math.floor(matchIdx / itemsPerPage) + 1;
                        }
                    }
                }

                renderNotificationsPage();

                if (!isSilent && window.PortalNotifications) {
                    window.PortalNotifications.refresh(false);
                }
            } catch (error) {
                console.log(error);
                if (!isSilent) {
                    list.innerHTML = `<div class="portal-notif-empty">Cannot connect to server.</div>`;
                }
            }
        }

        async function markAllPortalNotificationsRead() {
            try {
                const response = await fetch(`${API_BASE}/api/portal-notifications/read-all`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: loggedInUserId })
                });

                const data = await response.json();

                if (!data.success) {
                    alert(data.message || "Failed to mark notifications as read.");
                    return;
                }

                await loadPortalNotificationsPage();
                if (window.PortalNotifications) {
                    window.PortalNotifications.refresh(true);
                }
            } catch (error) {
                console.log(error);
                alert("Cannot connect to server.");
            }
        }

        loadPortalNotificationsPage();
    </script>

    <script src="../shared/portal-notifications.js" defer></script>

</body>

</html>
